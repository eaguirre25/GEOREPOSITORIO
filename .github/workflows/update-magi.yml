name: Update repository radar data

on:
  schedule:
    - cron: "20 12 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build multi-source dataset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAGI_LIMIT: "300"
          GITHUB_TOPIC_LIMIT: "12"
          HF_SPACES_LIMIT: "100"
          PWC_LIMIT: "80"
        run: python scripts/fetch_sources.py

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/georepositorio.json docs/data/georepositorio.csv docs/data/magi_repos.json docs/data/magi_repos.csv docs/data/source_watchlist.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update repository radar data"
            git push
          fi

      - name: Publish static dashboard branch
        run: |
          tmp_dir="$(mktemp -d)"
          cp -R docs/. "$tmp_dir/"
          git checkout --orphan gh-pages-deploy
          git rm -rf .
          cp -R "$tmp_dir"/. .
          touch .nojekyll
          git add .
          git commit -m "Deploy updated dashboard"
          git push origin HEAD:gh-pages --force
