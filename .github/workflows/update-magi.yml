name: Update MAGI data

on:
  schedule:
    - cron: "20 12 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build MAGI dataset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAGI_LIMIT: "300"
        run: python scripts/fetch_magi.py

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/magi_repos.json docs/data/magi_repos.csv
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update MAGI repository data"
            git push
          fi
